[project]
name = "scouting-arena-mcp"
version = "0.1.0"
description = "MCP server for The Scouting Arena football statistics API"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
scouting-mcp = "scouting_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
